# Xaccount-Generator 設定例
# cp config.example.yaml config.yaml して値を埋める

proxy:
  provider: "iproyal"          # iproyal / proxycheap / brightdata
  host: "geo.iproyal.com"
  port: 12321
  username: "YOUR_PROXY_USER"
  password: "YOUR_PROXY_PASS"
  country: ""                  # "" = 混合IP（最安）。"jp" で日本IP固定
  sticky_ttl_minutes: 30
  max_accounts_per_ip: 3       # 同一IPに割り当てる最大垢数（少なめ推奨）

browser:
  headless: true               # 本番はtrue、デバッグ時はfalseで目視確認
  slow_mo: 50
  default_timeout: 30000

factory:
  max_per_hour: 5              # 1時間の最大生成数（多すぎると凍結）
  use_phone: true              # SMS電話番号認証 (必須)
  setup_profile: true          # サインアップ後にプロフィール（アイコン・bio）を設定

sms:
  # provider: "5sim" が最安。ダメなら "smsactivate" に切り替え。
  # "auto" にすると api_key(5sim) と api_key2(smsactivate) を両方持ちにして残高ある方を使う。
  provider: "5sim"
  # 5sim.net APIキー (https://5sim.net/settings/profile)
  # X用番号: $0.04〜0.08/件。100垢で最大 $8
  api_key: "YOUR_5SIM_KEY"
  # auto モード時の smsactivate バックアップ (省略可)
  api_key2: ""
  # russia/india 等の激安国は X 側で弾かれやすく即BANの主因になるため非推奨。
  # 西側の国を優先し、コストより生存率を取る。
  preferred_countries:
    - "usa"
    - "england"
    - "germany"
    - "france"
    - "netherlands"

captcha:
  # ブラウザフロー時のソルバー:
  #   "capsolver"  — https://capsolver.com  (汎用・実績あり)
  #   "2captcha"   — https://2captcha.com
  #   "anticaptcha"— https://anti-captcha.com
  #   "capbypass"  — https://capbypass.com  (Outlook FunCaptcha に強い)
  #   "none"
  # provider → provider_fallback の順で自動フォールバック。
  # 残高不足・連続失敗 3 回でプロバイダーを自動スキップ。
  provider: "capsolver"
  api_key: ""
  provider_fallback: ""        # "capbypass" など2番手を入れると自動切り替え
  api_key_fallback: ""
  # API フロー (api_flow.py) の Arkose 解決は CDS 優先、ローカルは補助。
  # ローカル solver は BDA 固定値が多く X に拒否されやすいので CDS キー推奨。
  # Telegram @keysolv_bot で無料キー取得可。
  cds_api_key: ""

email:
  # "auto" (推奨): Outlook 優先 → 失敗したら mail.tm
  # "outlook" / "mailtm" で明示指定可
  # X は mail.tm 系の使い捨てドメインを弾くことが多いので Outlook を主にする
  provider: "auto"
  api_key: ""
  outlook_domain: "outlook.com"           # または hotmail.com
  outlook_client_id: "9e5f94bc-e8a4-4e73-b8be-63364c29d753"

twofa:
  enabled: true
  # 必ず32文字以上のランダム文字列に変更すること
  encryption_key: "change-this-to-a-long-random-string-at-least-32-chars"

db:
  path: "data/accounts.db"

logging:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  file: "data/bot.log"

warmup:
  min_days_before_sale: 21    # HStoraレベル: 21日以上
  actions_per_day_soft: 8

billing:
  # 目標単価: この金額を超えると WARNING ログを出す
  target_cost_per_account: 0.46
  # 上限単価: rolling avg がこれを超えると生成を自動停止 (1時間後に再試行)
  max_cost_per_account: 0.80
  # この残高を下回ったら Exodus から LTC を送るようにアラートを出す
  low_balance_alert_usd: 5.00

  # proxy-cheap.com — LTC で事前チャージして API キーを発行
  # ダッシュボード: https://app.proxy-cheap.com/
  proxy_cheap_api_key: "YOUR_PROXYCHEAP_KEY"
  # LTC 入金アドレス: proxy-cheap.com → Billing → Add Funds → Cryptocurrency → LTC
  proxy_cheap_ltc_address: ""

  # 5sim.net — LTC で事前チャージ
  # ダッシュボード: https://5sim.net/settings/profile で API キー取得
  # LTC 入金アドレス: 5sim.net → Finance → Deposit → Cryptocurrency → LTC
  sms_ltc_address: ""
