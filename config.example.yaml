# Xaccount-Generator 設定例
# このファイルをコピーして config.yaml を作成し、値を埋めてください
# cp config.example.yaml config.yaml

proxy:
  provider: "iproyal"          # iproyal / proxycheap / brightdata / oxylabs
  # IPRoyalの場合（ダッシュボードで確認）
  host: "geo.iproyal.com"
  port: 12321
  username: "YOUR_PROXY_USER"
  password: "YOUR_PROXY_PASS"
  country: "jp"                # 日本IP固定
  sticky_ttl_minutes: 30       # スティッキーセッション維持時間
  max_accounts_per_ip: 3       # 同一IPに割り当てる最大垢数（少なめ推奨）

browser:
  headless: true               # 本番はtrue。デバッグ時はfalseで目視確認
  slow_mo: 50                  # ms単位の操作遅延（人間らしさ）
  default_timeout: 30000       # 要素待ちタイムアウト(ms)

factory:
  max_per_hour: 5              # 1時間に生成する最大垢数（多すぎると凍結）
  use_phone: false             # SMS認証を使うか（trueにするとsms-activate連携が必要）
  captcha_provider: "capsolver" # capsolver / 2captcha / none
  captcha_api_key: ""          # capsolverのAPIキー

email:
  # mail.tm を使う場合は provider を空のまま（自動でmail.tmを使用）
  # outlook.com を生成する場合は "outlook" を指定
  provider: ""
  api_key: ""

twofa:
  enabled: true
  # 必ずランダムな長い文字列に変更すること（2FAシークレットの暗号化に使用）
  encryption_key: "change-this-to-a-long-random-string-at-least-32-chars"

db:
  path: "data/accounts.db"

logging:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  file: "data/bot.log"

warmup:
  min_days_before_sale: 10    # 生成後X日以上ウォームアップしてから「使える垢」とみなす
  actions_per_day_soft: 8     # 1日の行動上限（soft limit）
